name: updpkgsums

on:
  workflow_dispatch:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
    branches:
      - main
      - '*/.SRCINFO'

concurrency:
  group: updpkgsums-${{ github.event.pull_request.number || github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: true

jobs:
  updpkgsums:
    runs-on: ubuntu-latest
    container:
      image: archlinux:base-devel
    permissions:
      contents: write
      pull-requests: read
    steps:
      - name: Install Arch packaging tools
        shell: bash
        run: |
          set -euxo pipefail

          pacman -Syu --noconfirm --needed pacman-contrib git sudo
          useradd -m builder
          echo 'builder ALL=(ALL) NOPASSWD: ALL' >> /etc/sudoers

      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          repository: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name || github.repository }}
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.ref || github.ref_name }}

      - name: Mark workspace as safe for Git
        shell: bash
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Find updated packages
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euxo pipefail

          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            python - <<'PY'
          import json, os, urllib.request
          owner = "${{ github.repository_owner }}"
          repo = "${{ github.event.repository.name }}"
          pr = ${{ github.event.pull_request.number }}
          token = os.environ["GH_TOKEN"]
          url = f"https://api.github.com/repos/{owner}/{repo}/pulls/{pr}/files?per_page=100"
          req = urllib.request.Request(url, headers={"Authorization": f"Bearer {token}", "Accept": "application/vnd.github+json"})
          with urllib.request.urlopen(req) as r:
              data = json.load(r)
          pkgdirs = sorted({f["filename"].rsplit("/", 1)[0] for f in data if f.get("filename","").endswith("/PKGBUILD")})
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as env:
              env.write("pkgdirs<<EOF\n")
              env.write("\n".join(pkgdirs))
              env.write("\nEOF\n")
          PY
          else
            git fetch origin main
            mapfile -t pkgdirs < <(
              git diff --name-only origin/main...HEAD -- '*/PKGBUILD' \
                | xargs -r -n1 dirname \
                | sort -u
            )

            {
              echo 'pkgdirs<<EOF'
              printf '%s\n' "${pkgdirs[@]}"
              echo 'EOF'
            } >> "$GITHUB_ENV"
          fi

      - name: Update checksums and .SRCINFO
        if: ${{ env.pkgdirs != '' }}
        shell: bash
        run: |
          set -euxo pipefail

          for pkgbuild in $pkgdirs; do
            workpath="$GITHUB_WORKSPACE/$pkgbuild"
            buildroot="/home/builder/gh-action-$pkgbuild"

            rm -rf "$buildroot"
            install -d -o builder -g builder "$buildroot"
            cp -a "$workpath/." "$buildroot/"
            chown -R builder:builder "$buildroot"

            sudo -u builder AUR_REFRESH_ATTEMPTS=3 AUR_REFRESH_DELAY_SECONDS=60 bash -lc "
              set -euxo pipefail
              cd '$buildroot'
              bash '$GITHUB_WORKSPACE/.github/scripts/aur-refresh-metadata.sh' .
            "

            cp -f "$buildroot/PKGBUILD" "$workpath/PKGBUILD"
            cp -f "$buildroot/.SRCINFO" "$workpath/.SRCINFO"
          done

      - name: Commit
        if: ${{ env.pkgdirs != '' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
        uses: stefanzweifel/git-auto-commit-action@4a55954c782fc1ea30b9056cd3e7a2b40ca8887d # v7.2.0
        with:
          file_pattern: '*/PKGBUILD */.SRCINFO'
          commit_message: 'chore: refresh PKGBUILD checksums and SRCINFO'
          commit_user_name: JasonLandbridge
          commit_user_email: 15127381+JasonLandbridge@users.noreply.github.com
          commit_author: JasonLandbridge <15127381+JasonLandbridge@users.noreply.github.com>
          branch: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.ref || github.ref_name }}
