name: publish

on:
  workflow_dispatch:
    inputs:
      package:
        description: Package to publish; select auto to detect it from the latest commit
        required: true
        default: auto
        type: choice
        options:
          - auto
          - sefirah-bin
          - mcp-linker-bin
          - mcp-manager-bin
          - mcpproxy-bin
          - omniroute-bin
          - tabbyml-bin
          - tabbyml-cuda-bin
          - tabbyml-vulkan-bin
          - youtube-dl-gui
          - paseo-desktop-bin
  workflow_run:
    workflows: ["verify-pkgbuild"]
    types: [completed]

permissions:
  contents: read

jobs:
  publish:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout verified commit
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 2
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Select package
        env:
          REQUESTED_PACKAGE: ${{ inputs.package || 'auto' }}
        shell: bash
        run: |
          set -euo pipefail

          metadata_snapshot() {
            local ref="$1"
            local package_directory="$2"

            for package_file in PKGBUILD .SRCINFO; do
              git show "$ref:$package_directory/$package_file" 2>/dev/null \
                | sed -E 's/[[:space:]]+#.*$//' \
                | grep -E '^[[:space:]]*(epoch|pkgver|pkgrel|source|sha256sums|sha512sums|b2sums|provides)[[:space:]=]' \
                || true
            done | sed -E 's/[[:space:]]+/ /g'
          }

          if [[ "$REQUESTED_PACKAGE" != "auto" ]]; then
            pkgbuild="$REQUESTED_PACKAGE"
            selection="Manually selected"
          else
            base="$(git rev-parse HEAD~1)"
            head="$(git rev-parse HEAD)"

            pkgbuild="$(git diff --name-only "$base" "$head" -- '*/PKGBUILD' '*/.SRCINFO' \
              | sed -E 's|/[^/]+$||' \
              | sort -u \
              | head -n1 || true)"
            selection="Automatically detected"

            if [[ -n "$pkgbuild" ]]; then
              before_metadata="$(metadata_snapshot "$base" "$pkgbuild")"
              after_metadata="$(metadata_snapshot "$head" "$pkgbuild")"

              if [[ "$before_metadata" == "$after_metadata" ]]; then
                echo "Automatically detected package has no publishable metadata changes: $pkgbuild"
                pkgbuild=""
              fi
            fi
          fi

          if [[ -n "$pkgbuild" && ! -f "$pkgbuild/PKGBUILD" ]]; then
            echo "Package directory does not contain a PKGBUILD: $pkgbuild" >&2
            exit 1
          fi

          echo "pkgbuild=$pkgbuild" >> "$GITHUB_ENV"
          echo "$selection package: ${pkgbuild:-<none>}"

      - name: Select publisher
        if: ${{ env.pkgbuild != '' }}
        shell: bash
        run: |
          set -euo pipefail

          package_publisher="$(bash .github/scripts/select-publisher.sh "$pkgbuild")"
          echo "package_publisher=$package_publisher" >> "$GITHUB_ENV"
          echo "Selected publisher for $pkgbuild: $package_publisher"

      - name: Publish package to AUR
        if: ${{ env.pkgbuild != '' && env.package_publisher == 'aur' }}
        uses: KSXGitHub/github-actions-deploy-aur@da03e160361ce01bf087e790b6ffd196d7dccff7 # v4.1.3
        with:
          pkgname: ${{ env.pkgbuild }}
          pkgbuild: ${{ env.pkgbuild }}/PKGBUILD
          assets: |
            ${{ env.pkgbuild }}/*
            ${{ env.pkgbuild }}/.[!.]*
          commit_username: ${{ secrets.AUR_USERNAME }}
          commit_email: ${{ secrets.AUR_EMAIL }}
          ssh_private_key: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
          branch: main

      - name: Publish package to private repository
        if: ${{ env.pkgbuild != '' && env.package_publisher == 'private' }}
        env:
          PRIVATE_REPO_UPLOAD_URL: ${{ secrets.PRIVATE_REPO_UPLOAD_URL }}
          PRIVATE_REPO_UPLOAD_TOKEN: ${{ secrets.PRIVATE_REPO_UPLOAD_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail

          docker run --rm \
            --volume "$GITHUB_WORKSPACE:/workspace" \
            --workdir /workspace \
            --env PRIVATE_REPO_UPLOAD_URL \
            --env PRIVATE_REPO_UPLOAD_TOKEN \
            docker.io/library/archlinux:base-devel \
            bash .github/scripts/publish-private.sh "$pkgbuild"
