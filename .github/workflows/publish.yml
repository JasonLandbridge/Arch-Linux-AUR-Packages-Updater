name: publish

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["verify-pkgbuild"]
    types: [completed]

permissions:
  contents: read

jobs:
  publish:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout verified commit
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 2
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Find updated package
        shell: bash
        run: |
          set -euo pipefail

          base="$(git rev-parse HEAD~1)"
          head="$(git rev-parse HEAD)"

          pkgbuild="$(git diff --name-only "$base" "$head" -- '*/PKGBUILD' '*/.SRCINFO' \
            | sed -E 's|/[^/]+$||' \
            | sort -u \
            | head -n1 || true)"

          echo "pkgbuild=$pkgbuild" >> "$GITHUB_ENV"
          echo "Detected pkgbuild: ${pkgbuild:-<none>}"

      - name: Publish package
        if: ${{ env.pkgbuild != '' }}
        uses: KSXGitHub/github-actions-deploy-aur@da03e160361ce01bf087e790b6ffd196d7dccff7 # v4.1.3
        with:
          pkgname: ${{ env.pkgbuild }}
          pkgbuild: ${{ env.pkgbuild }}/PKGBUILD
          assets: |
            ${{ env.pkgbuild }}/*
            ${{ env.pkgbuild }}/.[!.]*
          commit_username: ${{ secrets.AUR_USERNAME }}
          commit_email: ${{ secrets.AUR_EMAIL }}
          ssh_private_key: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
