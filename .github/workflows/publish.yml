name: publish

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '*/PKGBUILD'

permissions:
  contents: read
  checks: read

jobs:
  verify-gate:
    runs-on: ubuntu-latest
    steps:
      - name: Wait for verify-pkgbuild check to succeed
        uses: actions/github-script@v8
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const ref = context.sha;
            const timeoutMs = 10 * 60 * 1000;
            const pollMs = 10000;
            const started = Date.now();

            while (true) {
              const { data } = await github.rest.checks.listForRef({
                owner,
                repo,
                ref,
                per_page: 100,
              });

              const verifyRuns = data.check_runs.filter((run) => run.name === 'verify');

              if (verifyRuns.length > 0) {
                const completed = verifyRuns.find((run) => run.status === 'completed');
                if (completed) {
                  if (completed.conclusion === 'success') {
                    core.info(`verify check succeeded: ${completed.html_url}`);
                    return;
                  }

                  core.setFailed(`verify check conclusion was ${completed.conclusion}: ${completed.html_url}`);
                  return;
                }
              }

              if (Date.now() - started > timeoutMs) {
                core.setFailed('Timed out waiting for verify check to complete');
                return;
              }

              await new Promise((resolve) => setTimeout(resolve, pollMs));
            }

  publish:
    needs: verify-gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Find updated package
        run: |
          #!/usr/bin/env bash
          set -euo pipefail

          pkgbuild="$(git diff --name-only HEAD~1 HEAD -- '*/PKGBUILD' '*/.SRCINFO' \
            | sed -E 's|/[^/]+$||' \
            | sort -u \
            | head -n1)"

          echo "pkgbuild=$pkgbuild" >> "$GITHUB_ENV"
          echo "Detected pkgbuild: $pkgbuild"

      - name: Publish package
        if: ${{ env.pkgbuild != '' }}
        uses: KSXGitHub/github-actions-deploy-aur@da03e160361ce01bf087e790b6ffd196d7dccff7 # v4.1.3
        with:
          pkgname: ${{ env.pkgbuild }}
          pkgbuild: ${{ env.pkgbuild }}/PKGBUILD
          assets: |
            ${{ env.pkgbuild }}/*
            ${{ env.pkgbuild }}/.[!.]*
          commit_username: ${{ secrets.AUR_USERNAME }}
          commit_email: ${{ secrets.AUR_EMAIL }}
          ssh_private_key: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
