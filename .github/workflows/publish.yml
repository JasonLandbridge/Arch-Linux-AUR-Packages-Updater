name: publish

on:
  workflow_dispatch:
    inputs:
      package:
        description: Package to publish; select auto to detect it from the latest commit
        required: true
        default: auto
        type: choice
        options:
          - auto
          - mcp-linker-bin
          - mcp-manager-bin
          - mcpproxy-bin
          - omniroute-bin
          - tabbyml-bin
          - tabbyml-cuda-bin
          - tabbyml-vulkan-bin
          - youtube-dl-gui
  workflow_run:
    workflows: ["verify-pkgbuild"]
    types: [completed]

permissions:
  contents: read

jobs:
  publish:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout verified commit
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 2
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Select package
        env:
          REQUESTED_PACKAGE: ${{ inputs.package || 'auto' }}
        shell: bash
        run: |
          set -euo pipefail

          if [[ "$REQUESTED_PACKAGE" != "auto" ]]; then
            pkgbuild="$REQUESTED_PACKAGE"
            selection="Manually selected"
          else
            base="$(git rev-parse HEAD~1)"
            head="$(git rev-parse HEAD)"

            pkgbuild="$(git diff --name-only "$base" "$head" -- '*/PKGBUILD' '*/.SRCINFO' \
              | sed -E 's|/[^/]+$||' \
              | sort -u \
              | head -n1 || true)"
            selection="Automatically detected"
          fi

          if [[ -n "$pkgbuild" && ! -f "$pkgbuild/PKGBUILD" ]]; then
            echo "Package directory does not contain a PKGBUILD: $pkgbuild" >&2
            exit 1
          fi

          echo "pkgbuild=$pkgbuild" >> "$GITHUB_ENV"
          echo "$selection package: ${pkgbuild:-<none>}"

      - name: Publish package
        if: ${{ env.pkgbuild != '' }}
        uses: KSXGitHub/github-actions-deploy-aur@da03e160361ce01bf087e790b6ffd196d7dccff7 # v4.1.3
        with:
          pkgname: ${{ env.pkgbuild }}
          pkgbuild: ${{ env.pkgbuild }}/PKGBUILD
          assets: |
            ${{ env.pkgbuild }}/*
            ${{ env.pkgbuild }}/.[!.]*
          commit_username: ${{ secrets.AUR_USERNAME }}
          commit_email: ${{ secrets.AUR_EMAIL }}
          ssh_private_key: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
